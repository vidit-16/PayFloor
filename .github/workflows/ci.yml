name: verify

# Lint + pytest with coverage, then the same gate as `python main.py verify`.
# Everything runs on a synthetic dataset generated from a fixed seed, with
# consistent model extractions, so CI needs no API key and no external data.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check .
      - name: Generate the synthetic dataset
        run: python data/generate_synthetic.py
      - name: Pytest with coverage
        run: python -m pytest --cov --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: coverage
          path: coverage.xml

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        working-directory: code
        run: pip install -r requirements.txt

      - name: Generate the synthetic dataset
        run: python data/generate_synthetic.py

      - name: Unit tests — output contract, cross-field rules, cache
        working-directory: code
        run: python tests/test_harness.py

      - name: Guard tests — malformed and adversarial input
        working-directory: code
        run: python tests/test_resilience.py

      - name: Invariant tests — properties over all 250 requests
        working-directory: code
        run: python tests/test_invariants.py

      - name: Produce output.csv and validate the contract
        working-directory: code
        run: python main.py run

      - name: Sanity and parity report
        working-directory: code
        run: python tools/sanity_report.py

      - name: Reproducibility — output must be byte-identical on a second run
        working-directory: code
        run: |
          cp ../dataset/output.csv /tmp/first.csv
          python main.py run
          diff -q /tmp/first.csv ../dataset/output.csv

      - name: Package and verify the submission archive
        working-directory: code
        run: python tools/package.py

      - uses: actions/upload-artifact@v4.6.2
        with:
          name: submission
          path: |
            code.zip
            dataset/output.csv

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Build image
        run: docker build -t affordability-engine:ci .
      - name: Run the engine inside the container
        run: docker run --rm affordability-engine:ci run

  mutation:
    # Slow (re-runs the suite once per mutant), so it does not gate pull requests.
    # It runs on every push to main, and can be started by hand on any branch.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - working-directory: code
        run: pip install -r requirements.txt
      - name: Generate the synthetic dataset
        run: python data/generate_synthetic.py

      - name: Mutation testing — are the tests load-bearing?
        working-directory: code
        run: python tests/test_mutation.py
